# Backend + Qdrant for local development.
# Run: docker compose up -d
# Then: uv run uvicorn src.main:app --reload --host 0.0.0.0 --port 8000

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: run the FastAPI app in Docker (use .env for GEMINI_API_KEY etc.)
  # app:
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   environment:
  #     - QDRANT_URL=http://qdrant:6333
  #   depends_on:
  #     qdrant:
  #       condition: service_healthy

volumes:
  qdrant_storage: {}
